<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Chat</title>
<style>
  :root {
    --accent: #ff4d8d;
    --accent-2: #a855f7;
    --bg: #0b0b12;
    --bg-2: #12121c;
    --panel: rgba(255,255,255,0.045);
    --border: rgba(255,255,255,0.07);
    --text: #ececf1;
    --text-dim: #8b8b9a;
    --name: #7dd3fc;
    --owner: #ffd84d;
    --mod: #7dd3fc;
    --super-1: #ff4e45;
    --super-2: #ff9800;
  }
  body.light {
    --bg: #f7f7fb;
    --bg-2: #ffffff;
    --panel: rgba(0,0,0,0.035);
    --border: rgba(0,0,0,0.08);
    --text: #14141c;
    --text-dim: #6b6b7b;
    --name: #065fd4;
    --owner: #b8860b;
    --mod: #0d47a1;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Inter, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    background:
      radial-gradient(1200px 600px at 10% -10%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 60%),
      radial-gradient(900px 500px at 110% 10%, color-mix(in srgb, var(--accent-2) 14%, transparent), transparent 60%),
      var(--bg);
    color: var(--text);
    padding: 12px;
    padding-bottom: 40px;
  }

  /* ==== HEADER STATS (FIXED, selalu kelihatan) ==== */
  .stats {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    background: linear-gradient(135deg,
      color-mix(in srgb, var(--accent) 14%, var(--bg)),
      color-mix(in srgb, var(--accent-2) 12%, var(--bg)));
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 6px 24px rgba(0,0,0,0.28);
    padding-top: calc(10px + env(safe-area-inset-top));
  }

  .stat {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .stat .ico {
    width: 30px; height: 30px;
    border-radius: 9px;
    display: grid; place-items: center;
    font-size: 16px;
    flex-shrink: 0;
    background: linear-gradient(135deg,
      color-mix(in srgb, var(--accent) 55%, transparent),
      color-mix(in srgb, var(--accent-2) 55%, transparent));
    color: #fff;
    box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .stat .ico svg { width: 15px; height: 15px; }
  .stat .info { display: flex; flex-direction: column; line-height: 1.05; min-width: 0; }
  .stat .label {
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: .4px;
    white-space: nowrap;
  }
  .stat .value {
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .dot-live {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #ff2d55;
    margin-right: 4px;
    vertical-align: middle;
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(255,45,85,0.7); }
    70%  { box-shadow: 0 0 0 8px rgba(255,45,85,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,45,85,0); }
  }

  /* Spacer biar chat tidak ketutup header fixed */
  .stats-spacer {
    height: 70px;
    height: calc(70px + env(safe-area-inset-top));
  }

  /* ==== STATUS ==== */
  #status {
    font-size: 12.5px;
    color: var(--text-dim);
    margin: 0 2px 10px;
    padding: 8px 12px;
    border-radius: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
  }

  /* ==== CHAT LIST ==== */
  #chat {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .msg {
    padding: 10px 13px;
    border-radius: 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    line-height: 1.5;
    word-wrap: break-word;
    overflow-wrap: anywhere;
    transition: background .2s ease, border-color .2s ease;
    animation: pop .18s ease;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(4px) scale(0.99); }
    to   { opacity: 1; transform: none; }
  }

  .name {
    color: var(--name);
    font-weight: 700;
    margin-right: 6px;
    font-size: 14px;
  }

  .badge {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .4px;
    margin-right: 6px;
    vertical-align: middle;
    text-transform: uppercase;
  }
  .owner { background: color-mix(in srgb, var(--owner) 22%, transparent); color: var(--owner); }
  .mod   { background: color-mix(in srgb, var(--mod) 22%, transparent); color: var(--mod); }

  .msg.member {
    background: linear-gradient(90deg,
      color-mix(in srgb, var(--accent) 10%, transparent),
      transparent 60%);
    border-left: 3px solid var(--accent);
  }

  .msg.superchat {
    background: linear-gradient(135deg, var(--super-1), var(--super-2));
    color: #fff;
    border: 0;
    box-shadow: 0 8px 24px color-mix(in srgb, var(--super-1) 35%, transparent);
  }
  .msg.superchat .name { color: #fff; }

  .amount {
    display: inline-block;
    background: rgba(0,0,0,0.28);
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 700;
    margin-left: 6px;
  }

  .skeleton {
    height: 44px;
    border-radius: 14px;
    background: linear-gradient(90deg,
      color-mix(in srgb, var(--panel) 100%, transparent) 25%,
      color-mix(in srgb, var(--accent) 10%, transparent) 50%,
      color-mix(in srgb, var(--panel) 100%, transparent) 75%);
    background-size: 200% 100%;
    animation: shine 1.4s infinite;
  }
  @keyframes shine {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: color-mix(in srgb, var(--accent) 40%, transparent);
    border-radius: 999px;
  }

  /* =================================================== */
  /* ============ RESPONSIVE KHUSUS HP ================= */
  /* =================================================== */
  @media (max-width: 600px) {
    body {
      font-size: 16px;
      padding: 8px;
      padding-bottom: 30px;
    }

    .stats {
      gap: 5px;
      padding: 7px 8px;
      padding-top: calc(7px + env(safe-area-inset-top));
    }

    .stat {
      padding: 6px 8px;
      gap: 6px;
      border-radius: 12px;
    }

    .stat .ico {
      width: 26px; height: 26px;
      border-radius: 8px;
    }
    .stat .ico svg { width: 13px; height: 13px; }

    .stat .label { font-size: 9px; letter-spacing: .3px; }
    .stat .value { font-size: 14px; }

    .stats-spacer {
      height: 60px;
      height: calc(60px + env(safe-area-inset-top));
    }

    #status { font-size: 11.5px; padding: 7px 10px; margin-bottom: 8px; }

    .msg {
      padding: 11px 13px;
      border-radius: 13px;
      font-size: 16px;              /* teks chat lebih besar */
      line-height: 1.5;
    }

    .name { font-size: 15.5px; }

    .badge { font-size: 9.5px; padding: 1px 6px; }
    .amount { font-size: 12px; }
    .skeleton { height: 48px; }
  }

  /* HP sangat kecil */
  @media (max-width: 360px) {
    .stat .label { font-size: 8.5px; }
    .stat .value { font-size: 13px; }
    .stat .ico { width: 22px; height: 22px; border-radius: 7px; }
    .stat .ico svg { width: 11px; height: 11px; }
    .stat { padding: 5px 6px; gap: 5px; }
    .msg { font-size: 15px; padding: 10px 11px; }
  }
</style>
</head>
<body>

<!-- HEADER FIXED -->
<div class="stats">
  <div class="stat">
    <div class="ico">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 12a5 5 0 110-10 5 5 0 010 10zm0-8a3 3 0 100 6 3 3 0 000-6z"/></svg>
    </div>
    <div class="info">
      <span class="label"><span class="dot-live"></span>Viewers</span>
      <span class="value" id="viewers">—</span>
    </div>
  </div>

  <div class="stat">
    <div class="ico">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.7-9.3C.7 8.4 2.7 5 6.2 5c2 0 3.4 1.1 4.3 2.3.3.4.9.4 1.2 0C12.6 6.1 14 5 16 5c3.5 0 5.5 3.4 3.9 6.7C19.5 16.4 12 21 12 21z"/></svg>
    </div>
    <div class="info">
      <span class="label">Likes</span>
      <span class="value" id="likes">—</span>
    </div>
  </div>

  <div class="stat">
    <div class="ico">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16a1 1 0 011 1v11a1 1 0 01-1 1H8l-4 4V5a1 1 0 011-1z"/></svg>
    </div>
    <div class="info">
      <span class="label">Chat</span>
      <span class="value" id="chatcount">0</span>
    </div>
  </div>
</div>

<!-- Spacer agar chat tidak ketutup header -->
<div class="stats-spacer"></div>

<div id="status">Memuat config.json...</div>
<div id="chat">
  <div class="skeleton"></div>
  <div class="skeleton"></div>
  <div class="skeleton"></div>
  <div class="skeleton"></div>
</div>

<script>
let CFG = {};
let liveChatId = "";
let pageToken = "";
let running = false;
let pollTimer = null;
let statsTimer = null;

function setStatus(s) {
  document.getElementById("status").textContent = s;
}

function fmt(n) {
  if (n === undefined || n === null || isNaN(n)) return "—";
  n = Number(n);
  if (n >= 1e9) return (n/1e9).toFixed(1).replace(/\.0$/,"") + "B";
  if (n >= 1e6) return (n/1e6).toFixed(1).replace(/\.0$/,"") + "M";
  if (n >= 1e3) return (n/1e3).toFixed(1).replace(/\.0$/,"") + "K";
  return n.toLocaleString("id-ID");
}

async function loadConfig() {
  try {
    const r = await fetch("config.json", { cache: "no-store" });
    CFG = await r.json();
  } catch (e) {
    setStatus("❌ Gagal baca config.json — buka via http:// (server lokal), bukan file://");
    return;
  }

  if (CFG.darkMode === false) document.body.classList.add("light");
  if (CFG.accentColor) {
    document.documentElement.style.setProperty("--accent", CFG.accentColor);
  }

  if (!CFG.apiKey || CFG.apiKey.includes("ISI_")) {
    setStatus("❌ apiKey belum diisi di config.json"); return;
  }
  if (!CFG.videoId) {
    setStatus("❌ videoId belum diisi di config.json"); return;
  }

  start();
}

async function fetchStats() {
  try {
    const r = await fetch(
      `https://www.googleapis.com/youtube/v3/videos` +
      `?part=liveStreamingDetails,statistics` +
      `&id=${CFG.videoId}&key=${CFG.apiKey}`
    );
    const d = await r.json();
    if (d.error) return;
    const item = d.items && d.items[0];
    if (!item) return;

    const lsd = item.liveStreamingDetails || {};
    const st  = item.statistics || {};

    document.getElementById("viewers").textContent =
      lsd.concurrentViewers ? fmt(lsd.concurrentViewers) : "—";
    document.getElementById("likes").textContent =
      st.likeCount ? fmt(st.likeCount) : "—";
  } catch(e) {}
}

async function start() {
  stop();
  running = true;
  document.getElementById("chat").innerHTML = "";
  setStatus(`Mengambil liveChatId untuk video ${CFG.videoId}...`);

  try {
    const r = await fetch(
      `https://www.googleapis.com/youtube/v3/videos` +
      `?part=liveStreamingDetails&id=${CFG.videoId}&key=${CFG.apiKey}`
    );
    const d = await r.json();

    if (d.error) { setStatus("❌ " + d.error.message); return; }
    if (!d.items || !d.items.length) { setStatus("❌ Video tidak ditemukan."); return; }

    const lsd = d.items[0].liveStreamingDetails;
    if (!lsd || !lsd.activeLiveChatId) {
      setStatus("❌ Video ini bukan live / live chat tidak aktif.");
      return;
    }

    liveChatId = lsd.activeLiveChatId;
    pageToken = "";
    setStatus("✅ Terhubung. Menunggu chat...");
    poll();

    fetchStats();
    clearInterval(statsTimer);
    statsTimer = setInterval(fetchStats, CFG.statsIntervalMs || 15000);
  } catch (e) {
    setStatus("❌ Fetch error: " + e.message);
  }
}

function stop() {
  running = false;
  clearTimeout(pollTimer);
  clearInterval(statsTimer);
}

async function poll() {
  if (!running) return;

  const max = Math.min(Math.max(CFG.maxResults || 200, 1), 2000);
  const url =
    `https://www.googleapis.com/youtube/v3/liveChat/messages` +
    `?liveChatId=${encodeURIComponent(liveChatId)}` +
    `&part=snippet,authorDetails` +
    `&maxResults=${max}` +
    `&key=${CFG.apiKey}` +
    (pageToken ? `&pageToken=${encodeURIComponent(pageToken)}` : "");

  try {
    const d = await (await fetch(url)).json();

    if (d.error) { setStatus("❌ " + d.error.message); return; }

    if (d.items && d.items.length) {
      d.items.forEach(addMsg);
      const total = document.querySelectorAll(".msg").length;
      document.getElementById("chatcount").textContent = fmt(total);
      setStatus(`✅ Live · menunggu chat baru...`);
    }

    pageToken = d.nextPageToken || "";
    const wait = CFG.pollIntervalMs > 0 ? CFG.pollIntervalMs : (d.pollingIntervalMillis || 3000);
    pollTimer = setTimeout(poll, wait);
  } catch (e) {
    setStatus("❌ " + e.message);
    pollTimer = setTimeout(poll, 5000);
  }
}

function addMsg(item) {
  const a = item.authorDetails || {};
  const s = item.snippet || {};
  const isSuper = !!s.superChatDetails;
  const isMember = !!s.memberMilestone || (a.isChatSponsor === true);

  const el = document.createElement("div");
  el.className = "msg";
  if (isSuper && CFG.showSuperChat !== false) el.classList.add("superchat");
  else if (isMember) el.classList.add("member");

  const nameSpan = document.createElement("span");
  nameSpan.className = "name";
  nameSpan.textContent = a.displayName || "?";
  el.appendChild(nameSpan);

  if (a.isChatOwner && CFG.showOwner !== false) {
    const b = document.createElement("span");
    b.className = "badge owner"; b.textContent = "Owner";
    el.appendChild(b);
  } else if (a.isChatModerator && CFG.showModerator !== false) {
    const b = document.createElement("span");
    b.className = "badge mod"; b.textContent = "Mod";
    el.appendChild(b);
  }

  const txt = document.createElement("span");
  txt.textContent = s.displayMessage || "";
  el.appendChild(txt);

  if (isSuper && CFG.showSuperChat !== false && s.superChatDetails.amountDisplayString) {
    const amt = document.createElement("span");
    amt.className = "amount";
    amt.textContent = s.superChatDetails.amountDisplayString;
    el.appendChild(amt);
  }

  const chat = document.getElementById("chat");
  const atBottom =
    (window.innerHeight + window.scrollY) >= (document.body.scrollHeight - 200);

  chat.appendChild(el);

  if (CFG.autoScroll !== false && atBottom) {
    window.scrollTo(0, document.body.scrollHeight);
  }
}

loadConfig();
</script>
</body>
</html>
